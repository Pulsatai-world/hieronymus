# ── The login system ──
# One login for staff and customers, one enrollment, one password re-confirmation. Every /api path a
# page calls must appear here: /api/two-factor once shipped without a route, answered 404, and with
# enrollment mandatory that locked every account out of the platform. test/api-routes.test.cjs now
# fails if a path a page calls is missing from this file.
[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/enroll"
  to = "/.netlify/functions/enroll"
  status = 200

[[redirects]]
  from = "/api/confirm-password"
  to = "/.netlify/functions/confirm-password"
  status = 200
