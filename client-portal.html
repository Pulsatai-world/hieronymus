<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/styles/akore-tokens.css">
<style>
  .wf { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .wf-step { display: flex; align-items: flex-start; gap: 14px; }
  .wf-step.current { border-color: var(--navy); box-shadow: 0 0 0 2px var(--violet-100); }
  .wf-step.locked { opacity: 0.55; }
  .wf-num { flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; background: var(--violet-100); color: var(--navy); font-family: var(--font-display); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .wf-step.done .wf-num { background: var(--emerald-700); color: #fff; }
  .wf-step.current .wf-num { background: var(--navy); color: #fff; }
  .wf-body { flex: 1; min-width: 0; }
  .wf-action { margin-top: 12px; }
</style>
<title>GEO Audit — Client Portal | Akore Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --navy: #6d4fe0;
  --emerald-700: #0f7d5b;
  --ink: #08090c;
  --surface: #f4f6f8;
  --card: #ffffff;
  --accent: #6d4fe0;
  --accent-light: #f4f2fb;
  --border: #e3e6ea;
  --radius-xs: 4px;
  --shadow: var(--shadow-sm);
  --ease-standard: cubic-bezier(0.2, 0.6, 0.2, 1);
  --fs-h2: 1.5rem;
  --fs-eyebrow: 0.6875rem;
  --font-display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--surface); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.6; }

.app-header {
  background: var(--card); border-bottom: 1px solid var(--border); padding: 0 40px; height: 64px;
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 0 var(--border);
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-lockup { height: 38px; width: auto; display: block; image-rendering: -webkit-optimize-contrast; }
.logo-mark { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
.logo-mark img { width: 100%; height: 100%; object-fit: contain; }
.logo-text { display: flex; flex-direction: column; }
.logo-name { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
.logo-sub { font-size: var(--fs-eyebrow); font-weight: 600; color: var(--ink-60); text-transform: uppercase; letter-spacing: 0.16em; display: flex; align-items: center; gap: 10px; }
.logo-sub::before { content: ""; width: 22px; height: 2px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
.logo-divider { width: 1px; height: 18px; background: var(--border-strong); }
.lang-toggle { display: flex; border: 1px solid var(--border-strong); border-radius: var(--radius-pill); overflow: hidden; }
.lang-btn { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--ink-60); background: var(--card); border: none; padding: 7px 14px; cursor: pointer; }
.lang-btn.active { background: var(--accent); color: #fff; }

.access-gate { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 20px; }
.access-gate-inner { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 40px 32px; text-align: center; }
.access-gate-icon { width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 50%; background: var(--violet-100); color: var(--navy); display: flex; align-items: center; justify-content: center; }
.access-gate-inner h2 { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 12px; }
.access-gate-inner p { font-size: 13px; color: var(--ink-60); line-height: 1.6; margin-bottom: 24px; }
.access-gate-inner input { width: 100%; font-family: var(--font-body); font-size: 15px; padding: 12px 16px; border: 1.5px solid var(--border-strong); border-radius: var(--radius-md); outline: none; margin-bottom: 14px; transition: border-color var(--dur-base) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard); }
.access-gate-inner input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
.access-gate-error { font-size: 12px; color: #b03a3a; margin-top: 12px; min-height: 16px; }
.btn-accent { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-pill); padding: 13px 20px; min-height: 44px; font-family: var(--font-body); font-weight: 600; font-size: 14px; letter-spacing: 0.01em; cursor: pointer; width: 100%; box-shadow: var(--shadow-sm); transition: background var(--dur-fast) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); }
.btn-accent:hover { background: var(--violet-700); box-shadow: var(--shadow-brand); }
.btn-accent:active { transform: translateY(1px); }

.main { max-width: 640px; margin: 0 auto; padding: 64px 24px 80px; display: none; }
.page-title { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 6px; }
.page-sub { font-size: 13px; color: var(--ink-60); margin-bottom: 28px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 28px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard); }
.card-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
.card-desc { font-size: 13px; color: var(--ink-60); }
.card-link { background: var(--accent); color: #fff; border-radius: var(--radius-pill); padding: 10px 18px; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; text-decoration: none; white-space: nowrap; box-shadow: var(--shadow-sm); transition: background var(--dur-fast) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard); }
.card-link:hover { background: var(--violet-700); box-shadow: var(--shadow-brand); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--ink-60); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.page-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.btn-ghost-sm { background: none; border: 1px solid var(--border-strong); color: var(--ink-60); border-radius: var(--radius-pill); padding: 7px 14px; font-family: var(--font-body); font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all var(--dur-base) var(--ease-standard); }
.btn-ghost-sm:hover { background: var(--accent-light); color: var(--accent); }
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(8,9,12,0.5); align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal-backdrop.open { display: flex; }
.modal-box { background: var(--card); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); }
.modal-box h3 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.modal-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
.modal-section:first-of-type { margin-top: 16px; padding-top: 0; border-top: none; }
.modal-section-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.field { margin-bottom: 10px; }
.field input, .field select { width: 100%; font-family: var(--font-body); font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 10px 12px; outline: none; transition: border-color var(--dur-base) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard); }
.field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
.field-msg { font-size: 12px; margin-top: 6px; min-height: 15px; }
.field-msg.error { color: #b03a3a; }
.field-msg.ok { color: #0f7d5b; }
.lang-choice { display: flex; gap: 8px; }
.lang-choice button { flex: 1; font-family: var(--font-body); font-size: 13px; padding: 9px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); cursor: pointer; }
.lang-choice button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-close-row { display: flex; justify-content: flex-end; margin-top: 20px; }
.card-col { flex-direction: column; align-items: stretch; }
.card-row-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.status-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: var(--radius-pill); background: var(--violet-100); color: var(--navy); margin-top: 6px; letter-spacing: 0.02em; }
.link-btn { background: none; border: none; color: var(--accent); font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; margin-top: 10px; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.kv-panel { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.kv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 12px; }
.kv-card:last-child { margin-bottom: 0; }
.kv-card-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.kv { display: grid; grid-template-columns: 180px 1fr; gap: 3px 14px; margin-bottom: 8px; }
.kv .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--ink-60); padding-top: 2px; }
.kv .v { font-size: 13px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
.kv .v.empty::before { content: '—'; color: var(--ink-60); }
.sub-card { background: var(--accent-light); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 8px; }
.sub-card:last-child { margin-bottom: 0; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; font-size: 11px; font-weight: 600; background: var(--accent-light); color: var(--accent); border-radius: var(--radius-pill); padding: 3px 10px; }
@media (max-width: 640px) { .kv { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .app-header { padding: 0 16px; } .logo-sub, .logo-divider { display: none; } }

/* ───────────────────────────────────────────────────────────────────────────────────────────
   App shell: full-bleed layout with a rail that expands on hover.
   Overrides the page styles above rather than replacing them, so the access gate and the
   settings modal keep working exactly as they did.
   ─────────────────────────────────────────────────────────────────────────────────────────── */
html, body { height: 100%; }
body.app-mode { margin: 0; overflow: hidden; background: var(--ice, #f4f6f8); }
body.app-mode .app-header { display: none; }

.shell { display: none; height: 100vh; }
body.app-mode .shell { display: flex; }

/* The rail. Collapsed it is an icon strip; expanded it overlays the content rather than
   pushing it, so the main view never reflows and nothing jumps while you read. */
.rail {
  position: relative; z-index: 40; flex: 0 0 var(--rail-w, 68px);
  background: #0f1117; color: #c9c2e8;
  display: flex; flex-direction: column;
  transition: flex-basis .18s var(--ease-standard, cubic-bezier(.2,.6,.2,1));
}
.rail-inner {
  position: absolute; inset: 0 auto 0 0; width: var(--rail-w, 68px);
  background: #0f1117; display: flex; flex-direction: column; overflow: hidden;
  transition: width .18s var(--ease-standard, cubic-bezier(.2,.6,.2,1));
  box-shadow: 0 0 0 rgba(0,0,0,0);
}
.rail:hover .rail-inner,
.rail.pinned .rail-inner,
.rail:focus-within .rail-inner { width: 248px; box-shadow: 14px 0 34px rgba(8,9,12,.28); }

.rail-top { display: flex; align-items: center; gap: 12px; padding: 18px 16px 22px; min-height: 64px; }
.rail-mark { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 9px; background: var(--violet-600, #6d4fe0);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display, sans-serif);
  font-weight: 800; color: #fff; font-size: 17px; }
.rail-co { font-family: var(--font-display, sans-serif); font-weight: 700; font-size: 14px; color: #fff;
  white-space: nowrap; overflow: hidden; }

.rail-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
.rail-item {
  display: flex; align-items: center; gap: 14px; padding: 11px 10px; border-radius: 10px;
  color: #c9c2e8; background: none; border: 0; width: 100%; cursor: pointer; text-align: left;
  font-family: inherit; font-size: 14px; white-space: nowrap; position: relative;
}
.rail-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.rail-item.active { background: var(--violet-600, #6d4fe0); color: #fff; font-weight: 600; }
.rail-item:focus-visible { outline: 2px solid var(--emerald-400, #34c592); outline-offset: 2px; }
.rail-ico { flex: 0 0 24px; display: flex; align-items: center; justify-content: center; }
.rail-ico svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }
.rail-label { overflow: hidden; }
/* A count of things waiting on the client. Shown on the collapsed rail too — the whole point
   is to be visible before anyone opens the menu. */
.rail-dot { position: absolute; left: 30px; top: 7px; min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: var(--emerald-500, #1ea97c); color: #06231a; font-size: 11px;
  font-weight: 800; display: flex; align-items: center; justify-content: center; }
.rail-foot { margin-top: auto; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 2px; }

.content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }
/* A view that manages its own height — the prompts panes, an embedded page — turns the shell's
   scroller off, so there is exactly one thing scrolling and it is never the page. */
.content.locked { overflow: hidden; }
.view-h1 { font-family: var(--font-display, sans-serif); font-size: 26px; font-weight: 700; color: var(--dark, #08090c); }
.view-sub { color: var(--ink-60, #5b6472); font-size: 14px; margin-bottom: 26px; max-width: 70ch; }

/* Tableros — the two choices */
.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
.pick-card { display: block; text-decoration: none; color: inherit; background: #fff;
  border: 1px solid var(--line, #e3e6ea); border-radius: 16px; padding: 26px; position: relative;
  transition: transform .14s, box-shadow .14s, border-color .14s; }
.pick-card:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(16,19,25,.12); border-color: var(--violet-300, #bcaef7); }
.pick-card.locked { opacity: .62; pointer-events: none; background: var(--ice2, #f4f2fb); }
.pick-ico { width: 46px; height: 46px; border-radius: 12px; background: var(--violet-100, #ece7fd);
  color: var(--violet-600, #6d4fe0); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.pick-ico svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pick-title { font-family: var(--font-display, sans-serif); font-size: 19px; font-weight: 700; margin-bottom: 6px; }
.pick-desc { font-size: 13.5px; color: var(--ink-60, #5b6472); line-height: 1.55; }
.pick-tag { position: absolute; top: 20px; right: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; padding: 4px 9px; border-radius: 999px; background: var(--violet-100, #ece7fd); color: var(--violet-700, #4834b0); }
.pick-tag.wait { background: #fff3e0; color: #8a5a00; }

/* Prompts monitoreados — list left, answers right */
.pm-card { text-align: left; background: #fff; border: 1px solid var(--line, #e3e6ea); border-left: 3px solid transparent;
  border-radius: 12px; padding: 13px 15px; cursor: pointer; font-family: inherit; width: 100%;
  transition: border-color .12s, box-shadow .12s; }
.pm-card:hover { border-color: var(--violet-300, #bcaef7); }
.pm-card.active { border-left-color: var(--violet-600, #6d4fe0); box-shadow: 0 6px 18px rgba(16,19,25,.09); }
.pm-card-top { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
.pm-code { font-family: var(--font-mono, monospace); font-size: 11px; font-weight: 700; color: var(--violet-600, #6d4fe0); }
.pm-text { font-size: 13.5px; line-height: 1.45; color: var(--dark, #08090c); }
.pm-pill { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.pm-pill.yes { background: var(--emerald-100, #d5f4e8); color: var(--emerald-700, #0f7d5b); }
.pm-pill.no { background: #f1f2f4; color: #6b7280; }

.pm-detail-q { font-size: 16px; line-height: 1.5; font-weight: 600; margin-bottom: 4px; }
.eng-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
.eng-name { font-family: var(--font-display, sans-serif); font-weight: 700; font-size: 14px; }

.pm-empty, .view-empty { background: #fff; border: 1px dashed var(--line, #e3e6ea); border-radius: 14px;
  padding: 44px 28px; text-align: center; color: var(--ink-60, #5b6472); font-size: 14px; }

.panel { background: #fff; border: 1px solid var(--line, #e3e6ea); border-radius: 16px; padding: 24px; margin-bottom: 18px; }
.panel-title { font-family: var(--font-display, sans-serif); font-weight: 700; font-size: 16px; margin-bottom: 14px; }

@media (max-width: 900px) {
  .pm { grid-template-columns: 1fr; }
  .pm-list { max-height: none; }
  .view { padding: 24px 18px 60px; }
}

/* ── Layout corrections ──────────────────────────────────────────────────────────────────── */
/* Content is no longer centred in a column: with a rail on the left, centring left a dead
   gutter beside it. Views start where the rail ends. */
.view { max-width: none; margin: 0; padding: 30px 38px 60px; }
.panel-desc { color: var(--ink-60,#5b6472); font-size: 13.5px; line-height: 1.55; margin-bottom: 16px; max-width: 70ch; }
.muted { color: var(--ink-60,#5b6472); }

/* The rail mark holds the real Akore mark rather than a letter. */
.rail-mark { background: transparent; padding: 0; }
.rail-mark img { width: 36px; height: 36px; display: block; border-radius: 9px; }

/* Framed pages — a dashboard or the intake form — inside the shell, so the rail stays put. */
.framewrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.framebar { flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
  padding: 10px 20px; border-bottom: 1px solid var(--line,#e3e6ea); background: #fff; }
.frametitle { font-family: var(--font-display,sans-serif); font-weight: 700; font-size: 14px; }
.frame { flex: 1 1 auto; width: 100%; border: 0; display: block; background: var(--ice,#f4f6f8); }

/* Pick cards are buttons now (they open in-shell), so reset the button chrome. */
.pick-card { font-family: inherit; text-align: left; width: 100%; cursor: pointer; }
.pick-card:disabled { cursor: default; }

/* ── Prompts: list left, one block per date with engines side by side ────────────────────── */
/* Fills its scroll container exactly; the panes inside do all the scrolling. */
.pm-page { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.review-bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; padding: 12px 20px; background: var(--violet-50,#f6f3fe);
  border-bottom: 1px solid var(--violet-100,#ece7fd); font-size: 14px; }

/* A fixed two-pane frame that owns the viewport height, so each pane scrolls inside itself
   instead of the page scrolling and clipping whatever happened to be at the fold. */
/* grid-template-rows: minmax(0,1fr) is the load-bearing part. A grid row defaults to `auto`,
   which sizes to its tallest child — so the answers pane grew to its full content height, its
   own overflow never engaged, and the whole page scrolled instead. minmax(0,…) lets the row be
   shorter than its content, which is what makes the panes scroll rather than the page. */
.pm { flex: 1 1 auto; display: grid; grid-template-columns: 340px minmax(0,1fr);
  grid-template-rows: minmax(0, 1fr); min-height: 0; overflow: hidden;
  gap: 0;
  /* Explicit, because an earlier rule in this file sets align-items:start. With `start` the
     panes size to their content instead of to the row, so the answers pane grew past the
     viewport and never scrolled. */
  align-items: stretch; }
.pm-side { display: flex; flex-direction: column; min-height: 0;
  border-right: 1px solid var(--line,#e3e6ea); background: #fff; }
.pm-side-head { display: flex; align-items: baseline; justify-content: space-between;
  padding: 22px 20px 10px; }
.pm-side-title { font-family: var(--font-display,sans-serif); font-weight: 700; font-size: 17px; }
.pm-side-count { font-size: 12px; color: var(--ink-60,#5b6472); }
.pm-search { margin: 0 20px 12px; font-family: inherit; font-size: 13px; padding: 9px 12px;
  border: 1px solid var(--line,#e3e6ea); border-radius: 9px; }
.pm-search:focus { outline: none; border-color: var(--violet-400,#9b86f2); box-shadow: 0 0 0 3px rgba(109,79,224,.12); }

/* The list scrolls on its own and ends with real breathing room, so the last card finishes
   cleanly instead of being sliced by the container edge. */
/* Height is set in JS to a whole number of cards, so the list can never end on a sliced one.
   overflow-y:scroll rather than auto: the track is always there, so the boundary reads as
   "there is more below" instead of as the list simply stopping. */
/* scrollbar-gutter AND ::-webkit-scrollbar together. Measured in Chrome: neither on its own
   reserves any width here — the bar stays an overlay that is invisible until you scroll, which
   made the list look like it simply stopped rather than scrolled. */
.pm-list { flex: 0 0 auto; min-height: 0; overflow-y: scroll; max-height: none;
  scrollbar-gutter: stable;
  padding: 0 6px 0 14px; display: flex; flex-direction: column; gap: 7px;
  /* Quantising the container only guarantees a clean edge at rest; once scrolled, cards would
     sit half-visible again. `proximity` settles on a card boundary without fighting the user
     the way `mandatory` does. */
  scroll-snap-type: y proximity; }
.pm-card { scroll-snap-align: start; }
.pm-list::-webkit-scrollbar { width: 10px; }
.pm-list::-webkit-scrollbar-track { background: transparent; }
.pm-list::-webkit-scrollbar-thumb { background: #d7dbe2; border-radius: 99px;
  border: 3px solid #fff; background-clip: padding-box; }
.pm-list::-webkit-scrollbar-thumb:hover { background: #b9bfc9; background-clip: padding-box; border: 3px solid #fff; }
/* Every card the same height, so "a whole number of cards" is a real measurement.
   flex:0 0 84px, not just height: flex items shrink by default, and in a fixed-height column
   37 cards were being squashed to fit instead of scrolling — which clipped the prompt text away
   and left the pills overlapping each other. */
/* Height comes from the list, which divides its own height into equal whole cards — see
   fitPromptList(). flex:0 0 auto, not a bare height: flex items shrink by default, and in a
   fixed-height column 15 cards were squashed to fit instead of scrolling. */
.pm-card { flex: 0 0 auto; height: var(--pm-card-h, 84px); box-sizing: border-box; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; }
.pm-card { border: 1px solid transparent; border-left: 3px solid transparent; border-radius: 10px;
  padding: 12px 13px; background: transparent; box-shadow: none; }
.pm-card:hover { background: var(--ice2,#f4f2fb); border-color: transparent; }
.pm-card.active { background: var(--violet-50,#f6f3fe); border-left-color: var(--violet-600,#6d4fe0); box-shadow: none; }
.pm-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.pm-text { font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }

/* Same scrollbar treatment as the list: gutter + webkit, or the bar is an invisible overlay. */
.pm-main { min-height: 0; overflow-y: scroll; scrollbar-gutter: stable;
  display: flex; flex-direction: column; }
.pm-main::-webkit-scrollbar { width: 10px; }
.pm-main::-webkit-scrollbar-track { background: transparent; }
.pm-main::-webkit-scrollbar-thumb { background: #d7dbe2; border-radius: 99px;
  border: 3px solid var(--ice,#f4f6f8); background-clip: padding-box; }
.pm-main::-webkit-scrollbar-thumb:hover { background: #b9bfc9; background-clip: padding-box; border: 3px solid var(--ice,#f4f6f8); }
.pm-main-head { position: sticky; top: 0; z-index: 2; background: var(--ice,#f4f6f8);
  padding: 22px 28px 14px; border-bottom: 1px solid var(--line,#e3e6ea); }
.pm-detail-q { font-size: 17px; line-height: 1.45; font-weight: 600; margin-bottom: 9px; max-width: 80ch; }
.pm-detail-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px; }
.pm-select { font-family: inherit; font-size: 12.5px; padding: 6px 10px; border: 1px solid var(--line,#e3e6ea);
  border-radius: 8px; background: #fff; margin-left: auto; }
.pm-main-body { padding: 22px 28px 60px; }

.date-block { margin-bottom: 26px; }
.date-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.date-label { font-family: var(--font-display,sans-serif); font-weight: 700; font-size: 13px;

  padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
.date-rule { flex: 1 1 auto; height: 1px; background: var(--line,#e3e6ea); }

/* Engines side by side for a single date. They collapse to one column when there is not
   enough width to read three at once. */
.eng-row { display: grid; grid-template-columns: repeat(var(--cols,3), minmax(0,1fr)); gap: 14px; }
.eng-col { background: #fff; border: 1px solid var(--line,#e3e6ea); border-radius: 13px;
  padding: 15px 16px; display: flex; flex-direction: column; min-width: 0; }
.eng-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 10px; padding-bottom: 9px; border-bottom: 1px solid var(--line,#e3e6ea); }
.eng-name { font-family: var(--font-display,sans-serif); font-weight: 700; font-size: 13px; }
.eng-body { font-size: 13px; line-height: 1.62; color: #2a2f3a; white-space: pre-wrap; word-break: break-word; }
.eng-body strong { font-weight: 700; }

/* ── Settings: three separate things, three separate panels ──────────────────────────────── */
.field-grid { display: grid; gap: 10px; max-width: 360px; margin-bottom: 14px; }
.field-grid input { font-family: inherit; font-size: 14px; padding: 10px 12px;
  border: 1px solid var(--line,#e3e6ea); border-radius: 9px; }
.field-grid input:focus { outline: none; border-color: var(--violet-400,#9b86f2); box-shadow: 0 0 0 3px rgba(109,79,224,.12); }
.acct { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; color: var(--ink-60,#5b6472); }
.acct span { font-family: var(--font-mono,monospace); }

@media (max-width: 1100px) { .eng-row { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .pm { grid-template-columns: 1fr; }
  .pm-side { border-right: 0; border-bottom: 1px solid var(--line,#e3e6ea); max-height: 44vh; }
}

/* Settings menu rows */
.set-list { display: flex; flex-direction: column; border: 1px solid var(--line,#e3e6ea);
  border-radius: 14px; overflow: hidden; background: #fff; max-width: 680px; }
.set-row { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;

  padding: 18px 20px; cursor: pointer; }
.set-row:last-child { border-bottom: 0; }
.set-row:hover { background: var(--ice2,#f4f2fb); }
.set-row-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 auto; }
.set-row-title { font-weight: 600; font-size: 14.5px; color: var(--dark,#08090c); }

.set-row-value { font-size: 13px; color: var(--ink-60,#5b6472); white-space: nowrap; }
.set-row-chev { font-size: 22px; line-height: 1; color: #b9bfc9; }

/* ── Inicio ──────────────────────────────────────────────────────────────────────────────── */
.home-top { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  gap: 20px; align-items: start; margin-bottom: 30px; }
.home-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.home-h2 { font-family: var(--font-display,sans-serif); font-weight: 700; font-size: 15px;
  margin: 0 0 14px; color: var(--dark,#08090c); }

/* Hero figure: the one number the screen leads with. */
.hero-card { background: #0f1117; color: #fff; border-radius: 18px; padding: 26px 26px 24px;
  position: relative; overflow: hidden; }
.hero-card::after { content: ''; position: absolute; right: -60px; top: -70px; width: 240px; height: 240px;
  border-radius: 50%; background: radial-gradient(circle, rgba(109,79,224,.5), transparent 70%); }
.hero-label { position: relative; z-index: 1; font-size: 11.5px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: #c9c2e8; }
.hero-figure { position: relative; z-index: 1; font-family: var(--font-display,sans-serif);
  font-size: 68px; font-weight: 800; line-height: 1.05; margin-top: 10px; font-variant-numeric: tabular-nums; }
.hero-unit { font-size: 30px; font-weight: 700; margin-left: 3px; color: #c9c2e8; }
.hero-note { position: relative; z-index: 1; font-size: 12.5px; color: #c9c2e8; margin-top: 4px; line-height: 1.5; }
.hero-delta { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px;

  background: rgba(255,255,255,.1); }
.hero-delta.up { color: #7bdcb6; } .hero-delta.down { color: #f3b0b0; } .hero-delta.flat { color: #c9c2e8; }
.hero-none { position: relative; z-index: 1; font-size: 14px; color: #c9c2e8; margin-top: 14px; line-height: 1.6; }

/* Status card. Colour is the last of three signals, after the icon and the words. */
.action { display: flex; gap: 14px; border-radius: 14px; padding: 16px 18px; border: 1px solid var(--line,#e3e6ea);
  background: #fff; }
.action.todo { border-color: #f0d9a8; background: #fffaf0; }
.action.ok { border-color: var(--emerald-100,#d5f4e8); background: var(--emerald-50,#eefaf4); }
.action-ico { flex: 0 0 22px; }
.action-ico svg { width: 22px; height: 22px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.action.todo .action-ico svg { stroke: #b07d16; }
.action.ok .action-ico svg { stroke: var(--emerald-600,#159066); }
.action-title { font-weight: 700; font-size: 14.5px; margin-bottom: 3px; }
.action-why { font-size: 13px; color: var(--ink-60,#5b6472); line-height: 1.5; }
.action-cta { margin-top: 12px; }

/* KPI row of stat tiles. */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: #fff; border: 1px solid var(--line,#e3e6ea); border-radius: 14px; padding: 16px 17px; min-width: 0; }

@media (max-width: 1000px) { .home-top { grid-template-columns: 1fr; } }

.tl { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line,#e3e6ea);
  border-radius: 14px; background: #fff; overflow: hidden; }

let lang = localStorage.getItem('hieronymus_lang') || 'es';

async function savePassword() {
  const cur = document.getElementById('set-current-password').value.trim();
  const next = document.getElementById('set-new-password').value.trim();
  const confirm = document.getElementById('set-confirm-password').value.trim();
  const msg = document.getElementById('password-msg');
  const btn = document.getElementById('save-password-btn');
  msg.className = 'field-msg';
  if (!cur || !next || !confirm) { msg.textContent = t('fillAllPasswordFields'); msg.className = 'field-msg error'; return; }
  if (next !== confirm) { msg.textContent = t('passwordsDontMatch'); msg.className = 'field-msg error'; return; }
  if (next.length < 6) { msg.textContent = t('passwordTooShort'); msg.className = 'field-msg error'; return; }
  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = t('savingLabel');
  try {
    const res = await fetch('/api/intake-codes', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session: window.akoreAuth.session(),
        username: clientUsername, currentPassword: cur, newPassword: next
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msg.textContent = res.status === 401 ? t('incorrectCurrentPassword') : (t('passwordSaveFailed') + (data.error || res.status));
      msg.className = 'field-msg error';
      return;
    }
    // Nothing to remember: the session is unaffected by a password change, and no password is
    // kept in the browser.
    document.getElementById('set-current-password').value = '';
    document.getElementById('set-new-password').value = '';
    document.getElementById('set-confirm-password').value = '';
    msg.textContent = t('passwordSaved');
    msg.className = 'field-msg ok';
  } catch (err) {
    msg.textContent = t('passwordSaveFailed') + err.message;
    msg.className = 'field-msg error';
  } finally {
    btn.disabled = false;
    btn.textContent = prevLabel;
  }
}

// opts.useTicket distinguishes restoring a session on page load from a person typing their
// password. A typed password always requires a code; a restore does not, or every hop between the
// customer's pages would ask for one.
// Applies a signed-in session to the page. One place, so the gate and the on-load restore cannot
// end up disagreeing about what the page knows about itself.
function adoptSession(who) {
  clientCompany = who.company || '';
  clientUsername = who.username || '';
  clientRole = who.role || 'full';
  clientMonitoring = !!who.monitoringEnabled;
  clientDiagnosisReleased = !!who.diagnosisReleased;
  clientMonitoringReleased = !!who.monitoringReleased;
  clientSubmittedAt = who.submittedAt || '';
  clientDefaultLanguage = who.defaultLanguage || '';
  if (clientDefaultLanguage && clientDefaultLanguage !== lang) {
    lang = clientDefaultLanguage;
    localStorage.setItem('hieronymus_lang', lang);
    applyStaticLang();
  }
  showApp();
}

async function submitGate() {
  const userInput = document.getElementById('gate-username-input');
  const passInput = document.getElementById('gate-password-input');
  const codeEl = document.getElementById('gate-code-input');
  const errEl = document.getElementById('gate-error');
  const username = userInput.value.trim().toLowerCase();
  const password = passInput.value.trim();
  const code = window.akoreCodeValue(codeEl);
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = t('enterCreds'); return; }

  // Three possible answers: in, needs a code, or needs an authenticator set up first. Setting one up
  // ends signed in, so there is no second step to get wrong.
  const attempt = await window.akoreSignIn(username, password, code, lang);
  if (attempt.cancelled) { errEl.textContent = ''; return; }
  if (attempt.needsCode) {
    errEl.textContent = window.showGateCode(attempt, lang, !!code);
    return;
  }
  if (!attempt.ok) {
    errEl.textContent = attempt.error || t('invalidCreds');
    passInput.classList.add('error');
    setTimeout(() => passInput.classList.remove('error'), 400);
    return;
  }
  adoptSession(attempt.who);
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function parseCSV(text) {
  const rows = [];
  let field = '', row = [], inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1)
    .filter(r => r.length === headers.length && r.some(v => v !== ''))
    .map(r => { const obj = {}; headers.forEach((h, idx) => obj[h] = r[idx]); return obj; });
}

function clientLogout() {

  if (window.clientLogoutAll) return window.clientLogoutAll();

/* Touch has no hover, so the rail would sit permanently collapsed on a phone. A tap pins it
   open, a tap elsewhere closes it, and keyboard users get the same through :focus-within. */
function wireRail() {
  const rail = document.getElementById('rail');
  rail.addEventListener('click', e => {
    if (window.matchMedia('(hover: hover)').matches) return;
    if (e.target.closest('.rail-item')) return;
    rail.classList.toggle('pinned');
  });
  document.addEventListener('click', e => { if (!rail.contains(e.target)) rail.classList.remove('pinned'); });
}

let lastListView = 'home';
function go(view) {
  if (!VIEWS.includes(view)) view = 'home';
  if (view === 'home' || view === 'dashboards') lastListView = view;
  currentView = view;
  location.hash = '#/' + view;
  renderRail();
  const c = document.getElementById('content');
  c.scrollTop = 0;
  // Prompts manages its own two scroll panes; dashboards and intake open a full-height frame.
  c.classList.toggle('locked', view === 'prompts' || view === 'intake');
  if (view !== 'settings') settingsPane = '';
  if (view === 'home') viewHome(c);
  else if (view === 'dashboards') viewDashboards(c);
  else if (view === 'prompts') viewPrompts(c);
  else if (view === 'intake') viewIntake(c);
  else viewSettings(c);
}

/* Anything that used to be its own page — a dashboard, the intake form — opens in a frame inside
   the shell instead of navigating away, because navigating away took the rail with it. The frame
   is same-origin, so its own page chrome can be hidden once it loads: the rail is the navigation
   now, and two sets of back links on one screen is worse than none. */
function openFramed(c, src, title, backKey) {
  c.classList.add('locked');
  c.innerHTML = `<div class="framewrap">
      <div class="framebar">
        <button class="btn-ghost-sm" onclick="go('${backKey}')">&larr; ${esc(t('navBack'))}</button>
        <span class="frametitle">${esc(title)}</span>
      </div>
      <iframe class="frame" id="view-frame" src="${src}" title="${esc(title)}"></iframe>
    </div>`;
  const f = document.getElementById('view-frame');
  f.addEventListener('load', () => {
    try {
      const d = f.contentDocument;
      if (!d) return;
      // Only the page's own navigation is hidden — the rail replaces it.
      //
      // Hiding a sticky header is not free: everything sticky below it carries a top offset
      // measured from that header (the intake form has a step bar at top:64px and a progress
      // rail at top:117px), and removing the header leaves them floating over the content.
      // Patching named selectors missed one and then the other, so the offsets are recomputed
      // from what is actually on the page instead of being guessed.
      const header = d.querySelector('.app-header');
      const shift = header ? header.getBoundingClientRect().height : 0;
      const st = d.createElement('style');
      st.textContent = '.headnav{display:none !important}.app-header{display:none !important}';
      d.head.appendChild(st);
      if (shift) {
        for (const el of d.querySelectorAll('*')) {
          const cs = f.contentWindow.getComputedStyle(el);
          if (cs.position !== 'sticky') continue;
          const top = parseFloat(cs.top);
          if (!isFinite(top) || top <= 0) continue;
          el.style.top = Math.max(0, top - shift) + 'px';
        }
      }
    } catch (e) { /* cross-origin should not happen here; nothing to do if it does */ }
  });
}

/* The question a client opens a portal with is "is anything waiting on me, and what changed?".
 * One headline number answers the second; a single action card answers the first.
 *
 * Deliberately not a chart. A handful of current values is a KPI row of stat tiles, and the
 * number the screen leads with is a hero figure — a one-bar bar chart of the same data would
 * say less and take more room. The trends live on the dashboards, which is where someone goes
 * once this screen has told them whether it is worth going.
 */
let homeExtra = null;

/* One date format everywhere. A bare 'YYYY-MM-DD' handed to new Date() is parsed as UTC
   midnight, which in any negative-offset timezone renders as the day before — that is why the
   next run on the 1st was showing as the 31st. Split and build a local date instead. */
function fmtDate(v) {
  if (!v) return '';
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString(lang === 'es' ? 'es-MX' : 'en-US',
    { day: 'numeric', month: 'short', year: 'numeric' });
}

async function loadHomeExtra() {
  if (homeExtra) return homeExtra;
  homeExtra = {};
  try {
    const res = await fetch(await window.apiQuery('/api/intake-codes', { company: clientCompany }));
    if (res.ok) homeExtra = await res.json();
  } catch { /* the next-run line simply does not render */ }
  return homeExtra;
}

/* The GEO Visibility Score for one snapshot, computed by the shared module the dashboards use
 * rather than reimplemented here — the first version of this screen had its own citation-rate
 * formula, which is how a home page and the dashboard one click below it ended up reporting
 * different numbers for the same company.
 *
 * The headline is the most recent run, whichever kind it was: what this screen is for is the
 * latest measurement, not the latest measurement of a particular type. */
function scoreOn(rows, date) {
  const r = rows.filter(x => x.snapshot_date === date);
  if (!r.length) return null;
  return window.AkoreScore.computeGeoScore(r).composite;
}

/* What has happened on this account, newest first. Answers "what changed since I last looked"
   without anyone having to send an email about it. */
function timeline(dates, rec) {
  const ev = [];
  if (clientSubmittedAt) ev.push({ at: clientSubmittedAt, text: t('evIntake') });
  if (rec && rec.diagnosisReleasedAt) ev.push({ at: rec.diagnosisReleasedAt, text: t('evDiag') });

  dates.forEach(d => ev.push({ at: d, text: t('evRun') }));
  ev.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if (!ev.length) return `<div class="view-empty">${t('evNone')}</div>`;
  return `<ol class="tl">` + ev.slice(0, 6).map(e => `
      <li class="tl-item"><span class="tl-dot" aria-hidden="true"></span>
        <span class="tl-when">${esc(fmtDate(e.at))}</span>
        <span class="tl-what">${e.text}</span></li>`).join('') + `</ol>`;
}

async function loadPromptRows() {
  if (pmRows) return pmRows;
  try {
    const res = await fetch(await window.resultsQuery(clientCompany));
    // normalizeRow, exactly as the dashboards do it. Every CSV cell arrives as a string, and
    // the shared score module does arithmetic on them — avg() over string ranks concatenates
    // instead of adding, which produced a GEO score of 4.1e+131 before this was added.
    pmRows = res.ok
      ? parseCSV(await res.text()).map(window.AkoreDashUtil.normalizeRow).filter(r => r.brand === clientCompany)
      : [];
  } catch { pmRows = []; }
  const byId = new Map();
  for (const r of pmRows) {
    const id = r.prompt_id || r.prompt_text;
    if (!byId.has(id)) byId.set(id, { id, code: r.prompt_id || '', text: r.prompt_text || '', rows: [] });
    byId.get(id).rows.push(r);
  }
  pmPrompts = [...byId.values()].sort((a,b) => String(a.code).localeCompare(String(b.code)));
  for (const p of pmPrompts) {
    p.dates = [...new Set(p.rows.map(r => r.snapshot_date).filter(Boolean))].sort().reverse();
    p.engines = [...new Set(p.rows.map(r => r.engine).filter(Boolean))].sort();
    p.cited = p.rows.some(r => isCited(r));
  }
  return pmRows;
}

/* Two lines of prompt text plus the code row is about 84px; the bounds keep a card readable
   when the space divides awkwardly. */
const CARD_BASE = 88, CARD_MIN = 88, CARD_MAX = 108, BOTTOM_BREATH = 14;
function fitPromptList() {
  const list = document.getElementById('pm-list');
  if (!list) return;
  const card = list.querySelector('.pm-card');
  if (!card) { list.style.height = ''; return; }
  const cs = getComputedStyle(list);
  const gap = parseFloat(cs.rowGap || cs.gap) || 0;
  const top = list.getBoundingClientRect().top;
  const room = Math.max(0, window.innerHeight - top - BOTTOM_BREATH);

  // Fit a whole number of cards into the space and give each of them an equal share of it, so
  // the list both fills its column and ends on a complete card. Quantising alone left up to a
  // card's worth of dead space at the bottom; stretching alone sliced the last one.
  let n = Math.max(1, Math.round((room + gap) / (CARD_BASE + gap)));
  let h = (room - (n - 1) * gap) / n;
  // Rounding can ask for one card more than fits. Raising it to CARD_MIN would then push the
  // list past the bottom of its pane, so drop a card instead and share the space among fewer.
  if (h < CARD_MIN && n > 1) { n -= 1; h = (room - (n - 1) * gap) / n; }
  h = Math.min(CARD_MAX, Math.max(CARD_MIN, h));
  list.style.setProperty('--pm-card-h', h.toFixed(2) + 'px');
  list.style.height = Math.min(room, n * h + (n - 1) * gap).toFixed(2) + 'px';
}
window.addEventListener('resize', () => { if (currentView === 'prompts') fitPromptList(); });

/* One row per run date, newest first, with every engine side by side inside it. The question
   people arrive with is "what did each of them say, and has that changed" — which is a
   comparison across engines on a date, and a sequence of those down the page. */
function paintPromptDetail() {
  const p = pmPrompts.find(x => x.id === pmSelected);
  const host = document.getElementById('pm-detail');
  if (!p) { host.innerHTML = `<div class="pm-empty">${t('pmNoAnswers')}</div>`; return; }

  const dates = pmDate ? [pmDate] : p.dates;
  const opt = (v,l) => `<option value="${esc(v)}"${pmDate===v?' selected':''}>${esc(l)}</option>`;

  const blocks = dates.map(date => {
    const cols = p.engines.map(e => {
      const r = p.rows.find(x => x.snapshot_date === date && x.engine === e);
      return `<div class="eng-col">
          <div class="eng-head">
            <span class="eng-name">${esc(properEngine(e))}</span>
            ${r ? `<span class="pm-pill ${isCited(r)?'yes':'no'}">${isCited(r)?t('pmCited'):t('pmNotCited')}</span>` : ''}
          </div>
          <div class="eng-body">${r ? (r.answer_excerpt ? mdLite(r.answer_excerpt) : `<em class="muted">${t('pmNoText')}</em>`)
                                    : `<em class="muted">${t('pmNoRun')}</em>`}</div>
        </div>`;
    }).join('');
    return `<div class="date-block">
        <div class="date-head"><span class="date-label">${esc(fmtDate(date))}</span><span class="date-rule"></span></div>
        <div class="eng-row" style="--cols:${p.engines.length}">${cols}</div>
      </div>`;
  }).join('');

  host.innerHTML = `<div class="pm-main-head">
      <div class="pm-detail-q">${esc(p.text)}</div>
      <div class="pm-detail-meta">
        <span class="pm-code">${esc(p.code)}</span>
        <span class="muted">${t('pmAnswers', p.rows.length)}</span>
        <select class="pm-select" onchange="setPmDate(this.value)">
          ${opt('', t('pmAllDates'))}${p.dates.map(d => opt(d, fmtDate(d))).join('')}
        </select>
      </div>
    </div>
    <div class="pm-main-body">${blocks || `<div class="pm-empty">${t('pmNoAnswers')}</div>`}</div>`;
}

function properEngine(e){const k=String(e||'').toLowerCase();

function mdLite(txt){return esc(txt).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');}

/* The settings modal's save routines read fixed element ids. Rather than duplicate the request
   logic for the inline panels, the values are copied across and the existing function runs. */
function savePasswordInline() {
  document.getElementById('set-current-password').value = document.getElementById('s-current-password').value;
  document.getElementById('set-new-password').value     = document.getElementById('s-new-password').value;
  document.getElementById('set-confirm-password').value = document.getElementById('s-confirm-password').value;
  const out = document.getElementById('s-password-msg');
  const src = document.getElementById('password-msg');
  savePassword();
  const relay = setInterval(() => {
    out.textContent = src.textContent; out.className = src.className.replace('field-msg', 'field-msg');
    if (src.textContent) {
      ['s-current-password','s-new-password','s-confirm-password'].forEach(id => {
        if (/✓|saved|guardada/i.test(src.textContent)) document.getElementById(id).value = '';
      });
    }
  }, 150);
  setTimeout(() => clearInterval(relay), 6000);
}

(async function initGate() {
  const params = new URLSearchParams(location.search);
  const usernameFromUrl = params.get('username');

  // Already signed in? The server decides, from the session this browser holds.
  const who = await window.akoreAuth.restore();
  if (who) { adoptSession(who); return; }

  // Staff opening a customer's own page. Uses the staff session already in this browser; nothing is
  // issued to it, and every request the page then makes carries that staff session. It means a staff
  // sign-in reaches any customer's pages — a deliberate trade for being able to help someone who has
  // lost their password.
  if (usernameFromUrl) {
    const asCustomer = await window.akoreStaffBypass(usernameFromUrl);
    if (asCustomer) { adoptSession(asCustomer); return; }
    const userInput = document.getElementById('gate-username-input');
    if (userInput) userInput.value = usernameFromUrl;
  }
  // Otherwise the gate asks for a username, a password and a code. Nothing is remembered between
  // visits except the session itself, so there is no stored password to restore from.
})();
</script>
</body>
</html>
