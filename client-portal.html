<style>
:root {
  --navy: #6d4fe0;
  --emerald-700: #0f7d5b;
  --ink: #08090c;
  --surface: #f4f6f8;
  --card: #ffffff;
  --accent: #6d4fe0;
  --accent-light: #f4f2fb;
  --border: #e3e6ea;
  --radius-xs: 4px;
  --shadow: var(--shadow-sm);
  --ease-standard: cubic-bezier(0.2, 0.6, 0.2, 1);
  --fs-h2: 1.5rem;
  --fs-eyebrow: 0.6875rem;
  --font-display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--surface); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.6; }

.app-header {
  background: var(--card); border-bottom: 1px solid var(--border); padding: 0 40px; height: 64px;
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 0 var(--border);
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-lockup { height: 38px; width: auto; display: block; image-rendering: -webkit-optimize-contrast; }
.logo-mark { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
.logo-mark img { width: 100%; height: 100%; object-fit: contain; }
.logo-text { display: flex; flex-direction: column; }
.logo-name { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
.logo-sub { font-size: var(--fs-eyebrow); font-weight: 600; color: var(--ink-60); text-transform: uppercase; letter-spacing: 0.16em; display: flex; align-items: center; gap: 10px; }
.logo-sub::before { content: ""; width: 22px; height: 2px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
.logo-divider { width: 1px; height: 18px; background: var(--border-strong); }
.lang-toggle { display: flex; border: 1px solid var(--border-strong); border-radius: var(--radius-pill); overflow: hidden; }
.lang-btn { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--ink-60); background: var(--card); border: none; padding: 7px 14px; cursor: pointer; }
.lang-btn.active { background: var(--accent); color: #fff; }

.access-gate { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 20px; }
.access-gate-inner { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 40px 32px; text-align: center; }
.access-gate-icon { width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 50%; background: var(--violet-100); color: var(--navy); display: flex; align-items: center; justify-content: center; }
.access-gate-inner h2 { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 12px; }
.access-gate-inner p { font-size: 13px; color: var(--ink-60); line-height: 1.6; margin-bottom: 24px; }
.access-gate-inner input { width: 100%; font-family: var(--font-body); font-size: 15px; padding: 12px 16px; border: 1.5px solid var(--border-strong); border-radius: var(--radius-md); outline: none; margin-bottom: 14px; transition: border-color var(--dur-base) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard); }
.access-gate-inner input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
.access-gate-error { font-size: 12px; color: #b03a3a; margin-top: 12px; min-height: 16px; }
.btn-accent { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-pill); padding: 13px 20px; min-height: 44px; font-family: var(--font-body); font-weight: 600; font-size: 14px; letter-spacing: 0.01em; cursor: pointer; width: 100%; box-shadow: var(--shadow-sm); transition: background var(--dur-fast) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); }
.btn-accent:hover { background: var(--violet-700); box-shadow: var(--shadow-brand); }
.btn-accent:active { transform: translateY(1px); }

.main { max-width: 640px; margin: 0 auto; padding: 64px 24px 80px; display: none; }
.page-title { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 6px; }
.page-sub { font-size: 13px; color: var(--ink-60); margin-bottom: 28px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 28px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard); }
.card-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
.card-desc { font-size: 13px; color: var(--ink-60); }
.card-link { background: var(--accent); color: #fff; border-radius: var(--radius-pill); padding: 10px 18px; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; text-decoration: none; white-space: nowrap; box-shadow: var(--shadow-sm); transition: background var(--dur-fast) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard); }
.card-link:hover { background: var(--violet-700); box-shadow: var(--shadow-brand); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--ink-60); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.page-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.btn-ghost-sm { background: none; border: 1px solid var(--border-strong); color: var(--ink-60); border-radius: var(--radius-pill); padding: 7px 14px; font-family: var(--font-body); font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all var(--dur-base) var(--ease-standard); }
.btn-ghost-sm:hover { background: var(--accent-light); color: var(--accent); }
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(8,9,12,0.5); align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal-backdrop.open { display: flex; }
.modal-box { background: var(--card); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); }
.modal-box h3 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.modal-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
.modal-section:first-of-type { margin-top: 16px; padding-top: 0; border-top: none; }
.modal-section-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.field { margin-bottom: 10px; }
.field input, .field select { width: 100%; font-family: var(--font-body); font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 10px 12px; outline: none; transition: border-color var(--dur-base) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard); }
.field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
.field-msg { font-size: 12px; margin-top: 6px; min-height: 15px; }
.field-msg.error { color: #b03a3a; }
.field-msg.ok { color: #0f7d5b; }
.lang-choice { display: flex; gap: 8px; }
.lang-choice button { flex: 1; font-family: var(--font-body); font-size: 13px; padding: 9px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); cursor: pointer; }
.lang-choice button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-close-row { display: flex; justify-content: flex-end; margin-top: 20px; }
.card-col { flex-direction: column; align-items: stretch; }
.card-row-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.status-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: var(--radius-pill); background: var(--violet-100); color: var(--navy); margin-top: 6px; letter-spacing: 0.02em; }
.link-btn { background: none; border: none; color: var(--accent); font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; margin-top: 10px; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.kv-panel { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.kv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 12px; }
.kv-card:last-child { margin-bottom: 0; }
.kv-card-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.kv { display: grid; grid-template-columns: 180px 1fr; gap: 3px 14px; margin-bottom: 8px; }
.kv .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--ink-60); padding-top: 2px; }
.kv .v { font-size: 13px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
.kv .v.empty::before { content: '—'; color: var(--ink-60); }
.sub-card { background: var(--accent-light); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 8px; }
.sub-card:last-child { margin-bottom: 0; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; font-size: 11px; font-weight: 600; background: var(--accent-light); color: var(--accent); border-radius: var(--radius-pill); padding: 3px 10px; }
@media (max-width: 640px) { .kv { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .app-header { padding: 0 16px; } .logo-sub, .logo-divider { display: none; } }
</style>

<body>

<div id="access-gate" class="access-gate">

    <input type="password" id="gate-password-input" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitGate()">

<main class="main" id="main-content"></main>

      <div class="field"><input type="password" id="set-new-password" autocomplete="new-password" data-t-placeholder="newPasswordPlaceholder" placeholder="New password"></div>
      <div class="field"><input type="password" id="set-confirm-password" autocomplete="new-password" data-t-placeholder="confirmPasswordPlaceholder" placeholder="Confirm new password"></div>
      <button class="btn-accent" id="save-password-btn" onclick="savePassword()" data-t="savePasswordBtn">Save password</button>
      <div class="field-msg" id="password-msg"></div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title" data-t="defaultLanguageTitle">Default language</div>
      <div class="field-hint" style="font-size:12px;color:var(--ink-60);margin-bottom:10px;" data-t="defaultLanguageDesc">The language you'll see by default each time you log in.</div>
      <div class="lang-choice">
        <button id="set-lang-en" onclick="saveDefaultLanguage('en')">English</button>

</div>

<script>
let clientCompany = '';
let clientMonitoring = false;

let clientSubmittedAt = '';

let intakeResponsesLoaded = false;
function findMember(group, username) {

}

const T = {
  logoSub: { en: 'GEO Audit — Client Portal', es: 'Auditoría GEO — Portal del cliente' },

function t(key, ...args) {
  const val = T[key][lang];
  return typeof val === 'function' ? val(...args) : val;
}
function applyStaticLang() {
  document.getElementById('logo-sub').textContent = t('logoSub');
  document.getElementById('gate-title').textContent = t('gateTitle');
  document.getElementById('gate-desc').textContent = t('gateDesc');
  document.getElementById('gate-username-input').placeholder = t('usernamePlaceholder');
  document.getElementById('gate-password-input').placeholder = t('passwordPlaceholder');
  document.getElementById('gate-continue-btn').textContent = t('continueBtn');
  document.getElementById('lang-btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('lang-btn-es').classList.toggle('active', lang === 'es');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
  document.querySelectorAll('[data-t-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-t-placeholder')); });
  document.getElementById('set-lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('set-lang-es').classList.toggle('active', lang === 'es');
}
function setLang(newLang) {
  lang = newLang;
  localStorage.setItem('hieronymus_lang', lang);
  applyStaticLang();
  if (document.getElementById('main-content').style.display === 'block') showApp();
}

async function savePassword() {
  const cur = document.getElementById('set-current-password').value.trim();
  const next = document.getElementById('set-new-password').value.trim();
  const confirm = document.getElementById('set-confirm-password').value.trim();
  const msg = document.getElementById('password-msg');
  const btn = document.getElementById('save-password-btn');
  msg.className = 'field-msg';
  if (!cur || !next || !confirm) { msg.textContent = t('fillAllPasswordFields'); msg.className = 'field-msg error'; return; }
  if (next !== confirm) { msg.textContent = t('passwordsDontMatch'); msg.className = 'field-msg error'; return; }
  if (next.length < 6) { msg.textContent = t('passwordTooShort'); msg.className = 'field-msg error'; return; }
  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = t('savingLabel');
  try {
    const res = await fetch('/api/intake-codes', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: sessionStorage.getItem('geo_portal_username'), currentPassword: cur, newPassword: next })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msg.textContent = res.status === 401 ? t('incorrectCurrentPassword') : (t('passwordSaveFailed') + (data.error || res.status));
      msg.className = 'field-msg error';
      return;
    }
    clientPassword = next;
    sessionStorage.setItem('geo_portal_password', next);
    document.getElementById('set-current-password').value = '';
    document.getElementById('set-new-password').value = '';
    document.getElementById('set-confirm-password').value = '';
    msg.textContent = t('passwordSaved');
    msg.className = 'field-msg ok';
  } catch (err) {
    msg.textContent = t('passwordSaveFailed') + err.message;
    msg.className = 'field-msg error';
  } finally {
    btn.disabled = false;
    btn.textContent = prevLabel;
  }
}

async function saveDefaultLanguage(newLang) {
  const msg = document.getElementById('language-msg');
  document.getElementById('set-lang-en').classList.toggle('active', newLang === 'en');
  document.getElementById('set-lang-es').classList.toggle('active', newLang === 'es');
  msg.className = 'field-msg';
  msg.textContent = t('savingLabel');
  try {
    const res = await fetch('/api/intake-codes', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: sessionStorage.getItem('geo_portal_username'), currentPassword: clientPassword, defaultLanguage: newLang })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    clientDefaultLanguage = newLang;
    setLang(newLang);
    msg.textContent = t('languageSaved');
    msg.className = 'field-msg ok';
  } catch (err) {
    msg.textContent = t('languageSaveFailed') + err.message;
    msg.className = 'field-msg error';
  }
}

async function submitGate() {
  const userInput = document.getElementById('gate-username-input');
  const passInput = document.getElementById('gate-password-input');
  const errEl = document.getElementById('gate-error');
  const username = userInput.value.trim().toLowerCase();
  const password = passInput.value.trim();
  errEl.textContent = '';
  if (!username || !password) {
    errEl.textContent = t('enterCreds');
    return;
  }
  // Routed through the shared client login so the two-factor step and its session token behave the
  // same on all three client pages, including the session-restore path that calls this on load.
  const codeEl = document.getElementById('gate-code-input');
  const typedCode = codeEl ? codeEl.value.trim() : '';
  const attempt = await window.clientLogin(username, password, typedCode);
  if (!attempt.ok && attempt.needsEnrollment) {
    // Two-factor is mandatory: walk them through setup, then retry the login. The token issued on
    // confirmation is already stored, so the retry goes through without asking for another code.
    const done = await window.startTwoFactorSetup({ username: username, password: password, lang: lang, audience: 'client' });
    if (done) return submitGate();
    errEl.textContent = window.showGateCode({ }, lang, false);
    return;
  }
  if (!attempt.ok && attempt.needsCode) {
    errEl.textContent = window.showGateCode(attempt, lang, !!typedCode);
    return;
  }
  try {
    if (!attempt.ok) throw new Error('bad credentials');
    const data = attempt.data;
    clientTwoFactorEnabled = !!data.twoFactorEnabled;
    clientCompany = data.company || '';
    clientMonitoring = !!data.monitoringEnabled;
    clientDiagnosisReleased = !!data.diagnosisReleased;
    clientMonitoringReleased = !!data.monitoringReleased;
    clientPassword = password;
    clientDefaultLanguage = data.defaultLanguage || '';
    clientSubmittedAt = data.submittedAt || '';
    clientUsername = username;
    clientRole = data.role || 'full';
    if (window.clearBypassSuppression) window.clearBypassSuppression();
    sessionStorage.setItem('geo_portal_username', username);
    sessionStorage.setItem('geo_portal_password', password);
    if (clientDefaultLanguage && clientDefaultLanguage !== lang) { lang = clientDefaultLanguage; localStorage.setItem('hieronymus_lang', lang); applyStaticLang(); }
    showApp();
  } catch {
    errEl.textContent = t('invalidCreds');
    passInput.classList.add('error');
  }
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function parseCSV(text) {
  const rows = [];
  let field = '', row = [], inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1)
    .filter(r => r.length === headers.length && r.some(v => v !== ''))
    .map(r => { const obj = {}; headers.forEach((h, idx) => obj[h] = r[idx]); return obj; });
}

function titleRow() {
  const settingsBtn = clientRole === 'viewer' ? '' : `<button class="btn-ghost-sm" onclick="openSettings()">${t('settingsBtn')}</button>`;
  return `<div class="page-title-row"><div class="page-title">${esc(clientCompany)}</div><div style="display:flex; gap:8px;">${settingsBtn}<button class="btn-ghost-sm" onclick="clientLogout()">${t('logoutBtn')}</button></div></div>`;
}
function clientLogout() {
  // Clears EVERY client session, not just this page's — see js/results-auth.js.
  if (window.clientLogoutAll) return window.clientLogoutAll();
  sessionStorage.clear();
  location.href = location.pathname;
}

function kv(label, value) {
  const v = value === undefined || value === null || value === '' ? '' : esc(value);
  return `<div class="kv"><div class="k">${esc(label)}</div><div class="v${v ? '' : ' empty'}">${v}</div></div>`;
}
function tagList(items) {
  if (!items || !items.length) return '<span style="color:var(--ink-60)">—</span>';
  return `<div class="tag-list">${items.map(i => `<span class="tag">${esc(i)}</span>`).join('')}</div>`;
}

function intakeCard() {
  const pending = !clientSubmittedAt;
  return `
    <div class="card card-col">
      <div class="card-row-top">
        <div>
          <div class="card-title">${t('intakeCardTitle')}</div>
          ${pending
            ? `<div class="card-desc">${t('intakeDescPending')}</div>`
            : `<div class="status-pill">${t('intakeSubmittedOn', esc(new Date(clientSubmittedAt).toLocaleDateString()))}</div>`}
        </div>
        ${pending ? `<a class="card-link" href="/intake.html?username=${encodeURIComponent(clientUsername)}">${t('completeIntakeBtn')}</a>` : ''}
      </div>
      ${!pending ? `
        <button type="button" class="link-btn" id="intake-toggle-btn" onclick="toggleIntakeResponses()">${t('viewResponsesLink')}</button>
        <div class="kv-panel" id="intake-responses-panel" style="display:none;"></div>

  const panel = document.getElementById('intake-responses-panel');
  const btn = document.getElementById('intake-toggle-btn');
  const isOpen = panel.style.display !== 'none';

    panel.style.display = 'none';
    btn.textContent = t('viewResponsesLink');

  }
  panel.style.display = 'block';
  btn.textContent = t('hideResponsesLink');
  if (intakeResponsesLoaded) return;
  panel.innerHTML = `<div class="empty-state">${t('loadingResponses')}</div>`;
  try {
    const res = await fetch(await window.intakeQuery(clientCompany));
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const d = record.intake || {};
    const g = d.general || {}, w = d.websites || {}, c = d.customer || {}, p = d.problem || {},
          j = d.jobToBeDone || {}, cat = d.category || {}, comp = d.competitors || {},
          sp = d.searchPatterns || {}, diff = d.differentiators || {}, pf = d.proof || {};
    panel.innerHTML = `
      <div class="kv-card"><div class="kv-card-title">General</div>

        ${kv('Role', g.role)}${kv('Email', g.email)}${kv('Primary language', g.language)}
      </div>
      <div class="kv-card"><div class="kv-card-title">Websites</div>
        ${kv('Primary site', w.primarySite)}${kv('Known issues', w.knownIssues)}
      </div>
      <div class="kv-card"><div class="kv-card-title">Customer</div>
        ${kv('Ideal customer', c.idealCustomer)}${kv('Trigger', c.trigger)}
      </div>
      <div class="kv-card"><div class="kv-card-title">Problem</div>
        ${kv('Description', p.description)}${kv('Pain type', p.painType)}
      </div>
      <div class="kv-card"><div class="kv-card-title">Job to be done</div>
        ${kv('Outcome', j.outcome)}${kv('Metrics', j.metrics)}
      </div>
      <div class="kv-card"><div class="kv-card-title">Category</div>
        ${kv('Category', cat.category)}${kv('Elevator pitch', cat.elevatorPitch)}
      </div>
      <div class="kv-card"><div class="kv-card-title">Competitors</div>
        ${kv('Competitors', comp.competitors)}${kv('Status quo', comp.statusQuo)}
      </div>
      <div class="kv-card"><div class="kv-card-title">Search patterns</div>
        ${kv('FAQ questions', sp.faqQuestions)}${kv('Objections', sp.objections)}
      </div>
      <div class="kv-card"><div class="kv-card-title">Differentiators</div>
        ${kv('Why choose us', diff.whyChoose)}${kv('Strongest fit', diff.strongest)}
      </div>

        ${kv('Star clients', pf.starClients)}${kv('Years in business', pf.yearsBusiness)}

function promptsCard() {
  return `
    <div class="card">
      <div>
        <div class="card-title">${t('promptsCardTitle')}</div>
        <div class="card-desc">${t('promptsCardDesc')}</div>
      </div>
      <a class="card-link" href="/prompt-review.html?username=${encodeURIComponent(clientUsername)}">${t('reviewPromptsBtn')}</a>
    </div>
  `;
}

async function showApp() {
  document.getElementById('access-gate').style.display = 'none';
  const main = document.getElementById('main-content');
  main.style.display = 'block';
  main.innerHTML = `${titleRow()}<div class="empty-state">${t('loading')}</div>`;

  let hasRuns = false, promptsExist = false, promptsApprovedAt = '';
  try {
    const res = await fetch(await window.resultsQuery(clientCompany));
    if (!res.ok) throw new Error('results not authorised');
    const rows = parseCSV(await res.text());
    hasRuns = rows.some(r => r.brand === clientCompany);
  } catch { /* fall back to "not ready" below */ }
  try {
    const pr = await fetch(await window.apiQuery('/api/prompts', { company: clientCompany }));
    if (pr.ok) { const pd = await pr.json(); promptsExist = !!(pd && pd.promptsText); promptsApprovedAt = (pd && pd.approvedAt) || ''; }
  } catch { /* treat as not-generated */ }

  const intakeDone = !!clientSubmittedAt;
  const promptsDone = !!promptsApprovedAt;
  // Highlight the single step the client should act on now (in priority order).
  const cur = !intakeDone ? 1 : (promptsExist && !promptsDone ? 2 : (hasRuns ? 3 : 0));
  const cls = (done, locked, n) => `card wf-step${done ? ' done' : ''}${locked ? ' locked' : ''}${cur === n ? ' current' : ''}`;
  const uname = encodeURIComponent(clientUsername);

  // Step 1 — Intake
  const step1 = `
    <div class="${cls(intakeDone, false, 1)}">
      <div class="wf-num">${intakeDone ? '✓' : '1'}</div>
      <div class="wf-body">
        <div class="card-title">${t('wfIntakeTitle')}</div>
        <div class="card-desc">${intakeDone ? t('wfIntakeDone', esc(new Date(clientSubmittedAt).toLocaleDateString())) : t('wfIntakeTodo')}</div>
        <div class="wf-action">${intakeDone
          ? `<a class="card-link" href="/intake.html?username=${uname}">${t('wfEditIntake')}</a>
             <button type="button" class="link-btn" id="intake-toggle-btn" onclick="toggleIntakeResponses()" style="margin-left:14px;">${t('viewResponsesLink')}</button>`
          : `<a class="btn-accent" href="/intake.html?username=${uname}">${t('completeIntakeBtn')}</a>`}</div>
        ${intakeDone ? `<div class="kv-panel" id="intake-responses-panel" style="display:none; margin-top:12px;"></div>` : ''}
      </div>
    </div>`;

  // Step 2 — Review prompts
  let s2status, s2action = '';
  if (!intakeDone) { s2status = t('wfPromptsLocked'); }
  else if (!promptsExist) { s2status = t('wfPromptsWaiting'); }
  else if (!promptsDone) { s2status = t('wfPromptsReady'); s2action = `<a class="btn-accent" href="/prompt-review.html?username=${uname}">${t('reviewPromptsBtn')}</a>`; }
  else { s2status = t('wfPromptsDone', esc(new Date(promptsApprovedAt).toLocaleDateString())); s2action = `<a class="card-link" href="/prompt-review.html?username=${uname}">${t('wfViewPrompts')}</a>`; }
  const step2 = `
    <div class="${cls(promptsDone, !intakeDone, 2)}">
      <div class="wf-num">${promptsDone ? '✓' : '2'}</div>
      <div class="wf-body">
        <div class="card-title">${t('wfPromptsTitle')}</div>
        <div class="card-desc">${s2status}</div>
        ${s2action ? `<div class="wf-action">${s2action}</div>` : ''}
      </div>
    </div>`;

  // Step 3 — Dashboard. A run has to exist AND staff has to have released it; monitoring is
  // released independently, so a client can have one dashboard and not the other.
  const diagShown = hasRuns && clientDiagnosisReleased;
  const monShown = clientMonitoringReleased;
  // Step 3 — Dashboard
  const step3 = `
    <div class="${cls(diagShown, !diagShown, 3)}">
      <div class="wf-num">${diagShown ? '✓' : '3'}</div>
      <div class="wf-body">
        <div class="card-title">${t('wfDashTitle')}</div>
        <div class="card-desc">${diagShown ? t('wfDashReady') : (hasRuns ? t('wfDashPreparing') : t('wfDashLocked'))}</div>
        ${diagShown || monShown ? `<div class="wf-action">
          ${diagShown ? `<a class="btn-accent" href="/dashboard-diagnostic.html?company=${encodeURIComponent(clientCompany)}">${t('wfOpenDashboard')}</a>` : ''}
          ${monShown ? `<a class="card-link" href="/dashboard-monitoring.html?company=${encodeURIComponent(clientCompany)}" style="${diagShown ? 'margin-left:14px;' : ''}">${t('monTitle')}</a>` : ''}
        </div>` : ''}
      </div>
    </div>`;

  main.innerHTML = `
    ${titleRow()}
    <div class="page-sub">${t('wfIntro')}</div>
    <div class="wf">${step1}${step2}${step3}</div>
  `;
}

applyStaticLang();

(async function initGate() {
  const params = new URLSearchParams(location.search);
  const usernameFromUrl = params.get('username');

  // Staff already logged into the internal Portal can open a customer's link straight
  // through, without also needing that customer's own password.
  if (usernameFromUrl && localStorage.getItem('hieronymus_internal_auth') === 'true'
      && !(window.clientBypassSuppressed && window.clientBypassSuppressed())) {
    try {
      const res = await fetch(await window.apiQuery('/api/intake-codes', {}));
      const data = await res.json();
      const group = (data.items || []).find(i => findMember(i, usernameFromUrl));
      const member = group && findMember(group, usernameFromUrl);
      if (group && member) {
        clientCompany = group.company || '';
        clientMonitoring = !!group.monitoringEnabled;
        clientDiagnosisReleased = !!group.diagnosisReleased;
        clientMonitoringReleased = !!group.monitoringReleased;
        clientDefaultLanguage = member.defaultLanguage || '';
        clientSubmittedAt = group.submittedAt || '';
        clientUsername = usernameFromUrl;
        clientRole = member.role || 'full';
        if (clientDefaultLanguage && clientDefaultLanguage !== lang) { lang = clientDefaultLanguage; localStorage.setItem('hieronymus_lang', lang); applyStaticLang(); }
        showApp();
        return;
      }
    } catch { /* fall through to the normal client login gate */ }
  }

  if (usernameFromUrl) {
    const userInput = document.getElementById('gate-username-input');
    if (userInput) userInput.value = usernameFromUrl;
  }
  const usernameToTry = sessionStorage.getItem('geo_portal_username');
  const passwordToTry = sessionStorage.getItem('geo_portal_password');
  if (usernameToTry && passwordToTry) {
    document.getElementById('gate-username-input').value = usernameToTry;
    document.getElementById('gate-password-input').value = passwordToTry;
    submitGate();
  }
})();
