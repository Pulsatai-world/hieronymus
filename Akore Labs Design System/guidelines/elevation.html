<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-body);background:var(--ink-50);color:var(--text-body)}.wrap{padding:30px 26px;display:flex;gap:22px;flex-wrap:wrap}.b{width:120px;height:82px;background:#fff;border-radius:var(--radius-lg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head>
<body><div class="wrap">
<div class="b" style="box-shadow:var(--shadow-sm)">sm</div>
<div class="b" style="box-shadow:var(--shadow-md)">md</div>
<div class="b" style="box-shadow:var(--shadow-lg)">lg</div>
<div class="b" style="box-shadow:var(--shadow-brand)">brand</div>
</div></body></html>
