<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Corner radius scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-body);background:#fff;color:var(--text-body)}.wrap{padding:24px 26px;display:flex;gap:16px;flex-wrap:wrap}.b{width:88px;height:88px;background:var(--violet-100);border:1px solid var(--violet-300);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-family:var(--font-mono);font-size:10px;color:var(--violet-700)}</style></head>
<body><div class="wrap">
<div class="b" style="border-radius:var(--radius-sm)">sm · 8</div>
<div class="b" style="border-radius:var(--radius-md)">md · 12</div>
<div class="b" style="border-radius:var(--radius-lg)">lg · 16</div>
<div class="b" style="border-radius:var(--radius-xl)">xl · 24</div>
<div class="b" style="border-radius:var(--radius-2xl)">2xl · 32</div>
<div class="b" style="border-radius:var(--radius-pill)">pill</div>
</div></body></html>
