<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — Status" subtitle="Success · warning · danger · info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-body);background:#fff}.row{display:flex;padding:22px;gap:14px}.sw{flex:1;height:88px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;color:#fff}.sw .n{font-weight:700;font-size:13px}.sw .h{font-family:var(--font-mono);font-size:10px;opacity:.85}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--success)"><span class="n">Success</span><span class="h">#1ea97c</span></div>
<div class="sw" style="background:var(--warning)"><span class="n">Warning</span><span class="h">#d99312</span></div>
<div class="sw" style="background:var(--danger)"><span class="n">Danger</span><span class="h">#d94a4a</span></div>
<div class="sw" style="background:var(--info)"><span class="n">Info</span><span class="h">#6d4fe0</span></div>
</div></body></html>
