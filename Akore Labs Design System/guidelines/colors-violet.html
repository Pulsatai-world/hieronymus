<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-body);background:#fff}.row{display:flex;padding:20px;gap:0}.sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px}.sw span{font-family:var(--font-mono);font-size:10px}.n{font-weight:600}.h{opacity:.7}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--violet-900);color:#fff"><span class="n">900</span><span class="h">#2a1f6b</span></div>
<div class="sw" style="background:var(--violet-700);color:#fff"><span class="n">700</span><span class="h">#4834b0</span></div>
<div class="sw" style="background:var(--violet-600);color:#fff"><span class="n">600 · brand</span><span class="h">#6d4fe0</span></div>
<div class="sw" style="background:var(--violet-500);color:#fff"><span class="n">500</span><span class="h">#8168ea</span></div>
<div class="sw" style="background:var(--violet-400);color:#fff"><span class="n">400</span><span class="h">#9b86f2</span></div>
<div class="sw" style="background:var(--violet-300);color:#2a1f6b"><span class="n">300</span><span class="h">#bcaef7</span></div>
<div class="sw" style="background:var(--violet-100);color:#4834b0"><span class="n">100</span><span class="h">#ece7fd</span></div>
<div class="sw" style="background:var(--violet-50);color:#4834b0"><span class="n">50</span><span class="h">#f6f3fe</span></div>
</div></body></html>
