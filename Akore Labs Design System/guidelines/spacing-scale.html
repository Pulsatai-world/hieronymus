<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-body);background:#fff;color:var(--text-body)}.wrap{padding:24px 30px;display:flex;flex-direction:column;gap:9px}.r{display:flex;align-items:center;gap:14px;font-size:12px}.bar{height:14px;background:var(--violet-500);border-radius:3px}.tok{font-family:var(--font-mono);color:var(--text-muted);width:120px}</style></head>
<body><div class="wrap">
<div class="r"><span class="tok">--space-1 · 4</span><span class="bar" style="width:4px"></span></div>
<div class="r"><span class="tok">--space-2 · 8</span><span class="bar" style="width:8px"></span></div>
<div class="r"><span class="tok">--space-4 · 16</span><span class="bar" style="width:16px"></span></div>
<div class="r"><span class="tok">--space-6 · 24</span><span class="bar" style="width:24px"></span></div>
<div class="r"><span class="tok">--space-8 · 32</span><span class="bar" style="width:32px"></span></div>
<div class="r"><span class="tok">--space-12 · 48</span><span class="bar" style="width:48px"></span></div>
<div class="r"><span class="tok">--space-16 · 64</span><span class="bar" style="width:64px"></span></div>
<div class="r"><span class="tok">--space-24 · 96</span><span class="bar" style="width:96px"></span></div>
</div></body></html>
