<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-body);background:#fff;color:var(--text-strong)}.wrap{padding:26px 30px;display:flex;flex-direction:column;gap:16px}.eb{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}.tick{width:22px;height:2px;background:var(--violet-600);border-radius:2px}.dot{width:7px;height:7px;border-radius:50%;background:var(--emerald-500)}h2{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;margin:0;font-size:34px}</style></head>
<body><div class="wrap">

</div></body></html>
