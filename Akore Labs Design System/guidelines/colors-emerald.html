<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-body);background:#fff}.row{display:flex;padding:20px;gap:0}.sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px}.sw span{font-family:var(--font-mono);font-size:10px}.n{font-weight:600}.h{opacity:.7}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--emerald-700);color:#fff"><span class="n">700</span><span class="h">#0f7d5b</span></div>
<div class="sw" style="background:var(--emerald-600);color:#fff"><span class="n">600</span><span class="h">#159066</span></div>
<div class="sw" style="background:var(--emerald-500);color:#fff"><span class="n">500 · accent</span><span class="h">#1ea97c</span></div>
<div class="sw" style="background:var(--emerald-400);color:#053a2a"><span class="n">400</span><span class="h">#34c592</span></div>
<div class="sw" style="background:var(--emerald-300);color:#0f7d5b"><span class="n">300</span><span class="h">#7bdcb6</span></div>
<div class="sw" style="background:var(--emerald-100);color:#0f7d5b"><span class="n">100</span><span class="h">#d5f4e8</span></div>
<div class="sw" style="background:var(--emerald-50);color:#0f7d5b"><span class="n">50</span><span class="h">#eefaf4</span></div>
</div></body></html>
