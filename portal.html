<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="/styles/akore-tokens.css">
<title>Akore Labs — Consola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles/portal-shell.css">
</head>
<body>

<!-- The application. One shell, one rail, one content area; every screen renders into #content. -->
<div class="shell" id="shell" hidden>
  <div class="content" id="content"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/js/auth.js"></script>
<!-- Before anything reads a session. `audience` defaults to 'client', so without this the
     console reads the customer session slot: a staff session sitting in localStorage is
     invisible, and reopening the browser demands a full sign-in with a code every time. -->
<script>window.akoreAuth.useStaffSession();</script>
<script src="/js/portal-rail.js"></script>
<script src="/js/dash/util.js"></script>
<script src="/js/dash/score.js"></script>
<script src="/js/portal-app.js"></script>
</body>
</html>
