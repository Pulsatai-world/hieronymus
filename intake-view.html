<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/styles/akore-tokens.css">
<title>Akore Labs — Intake Responses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="/js/auth.js"></script>
<script src="/js/portal-rail.js"></script>
<script>window.akoreAuth.useStaffSession();</script>
<script src="/js/enroll-dialog.js"></script>
<script>
// Who is signed in comes from the session the server validated on load.

function showPasswordGate() {
  // There is one sign-in page, and this is not it. Every page used to carry its own form — six of
  // them, each with its own strings and its own handling of the answer. Send them to the one that
  // exists, remembering where they were going.
  window.akoreGoToLogin();
}

function checkAuth() {
  // Signed in means the server recognised our session on this page load — see the guarded init at
  // the end of this file. Not a stored flag, which proved nothing and granted everything.
  //
  // And signed in as STAFF. A customer's session is a real session; it just does not belong on an
  // internal page, and answering "yes" for one rendered this shell to them with every data call
  // refused underneath it.
  const who = window.akoreAuth.who();
  return !!(who && who.kind === 'staff');
}

async function staffLogout() {
  // Ends the session on the server too, so signing out really signs out.
  await window.staffLogoutAll('/portal.html');
}

</script>
<link rel="stylesheet" href="/styles/console.css">
</head>
<body>

<header class="header" hidden>
  <div class="logo" onclick="location.href='/portal.html'" style="cursor:pointer;" title="Akore Labs — inicio">
    <img class="logo-lockup" src="/brand/logo-horizontal-light.png" alt="Akore Labs">
    <span class="logo-divider"></span>
    <div class="logo-sub">Intake Responses</div>
  </div>
  <a class="nav-link" href="/portal.html">← Portal</a>
  <button class="nav-link" onclick="staffLogout()" style="cursor:pointer;">Log out</button>
</header>

<div class="subnav">
      <a class="btn btn-ghost btn-sm" href="javascript:history.back()">← Volver</a>
      <span class="subnav-name">Respuestas del formulario</span>
    </div>
<main class="main" id="main-content">
  <div class="empty-state">Loading…</div>
</main>

<script>
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function kv(label, value) {
  // A multiple-choice answer is a list. Passed through esc() it rendered as "cost,quality", joined
  // by a comma the customer never typed and indistinguishable from one answer containing a comma.
  if (Array.isArray(value)) {
    return `<div class="kv"><div class="k">${esc(label)}</div><div class="v${value.length ? '' : ' empty'}">${tagList(value)}</div></div>`;
  }
  const v = value === undefined || value === null || value === '' ? '' : esc(value);
  return `<div class="kv"><div class="k">${esc(label)}</div><div class="v${v ? '' : ' empty'}">${v}</div></div>`;
}
function tagList(items) {
  if (!items || !items.length) return '<span style="color:var(--text-dim)">—</span>';
  return `<div class="tag-list">${items.map(i => `<span class="tag">${esc(i)}</span>`).join('')}</div>`;
}

async function load() {
  const params = new URLSearchParams(location.search);
  const company = params.get('company');
  const main = document.getElementById('main-content');
  if (!company) {
    main.innerHTML = '<div class="empty-state">No company specified.</div>';
    return;
  }

  let record;
  try {
    const res = await fetch(await window.intakeQuery(company));
    if (res.status === 404) {
      main.innerHTML = `<div class="page-title">${esc(company)}</div><div class="empty-state">No intake submitted yet for this client.</div>`;
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    record = await res.json();
  } catch (err) {
    main.innerHTML = '<div class="empty-state">Failed to load: ' + esc(err.message) + '</div>';
    return;
  }

  // Questions staff added to this customer's form. They are stored under `extra.` and every card
  // below is a hand-written list of the original questions, so without this the answers were
  // collected and shown to no one — the form could ask something staff could never read.
  //
  // The wording comes from the customer's own template when it can be fetched, because the key is a
  // slug ("shiftPattern") and the question was "¿Qué turnos manejan?".
  let extraLabels = {};
  try {
    const tplRes = await fetch(await window.apiQuery('/api/intake-template', { company }));
    if (tplRes.ok) {
      const rec = await tplRes.json();
      const tpl = rec.released || rec.draft;
      for (const f of (tpl && tpl.fields) || []) {
        for (const path of f.paths || []) {
          if (path.indexOf('extra.') === 0) extraLabels[path.slice(6)] = (f.label && (f.label.es || f.label.en)) || '';
        }
      }
    }
  } catch (e) { /* the keys alone are still better than nothing */ }

  const d = record.intake || {};
  const g = d.general || {}, w = d.websites || {}, c = d.customer || {}, p = d.problem || {},
        j = d.jobToBeDone || {}, cat = d.category || {}, comp = d.competitors || {},
        sp = d.searchPatterns || {}, diff = d.differentiators || {}, pf = d.proof || {};

  const extra = d.extra || {};
  const extraKeys = Object.keys(extra).filter(k => {
    const v = extra[k];
    return Array.isArray(v) ? v.length : (v !== undefined && v !== null && v !== '');
  });
  const extraCard = extraKeys.length
    ? `<div class="card">
         <div class="card-title">Added questions</div>
         ${extraKeys.map(k => kv(extraLabels[k] || k, extra[k])).join('')}
       </div>`
    : '';

  main.innerHTML = `
    <div class="page-title">${esc(record.company || company)}</div>
    <div class="meta-line">Saved ${record.savedAt ? esc(new Date(record.savedAt).toLocaleString()) : 'unknown'}</div>

    <div class="card">
      <div class="card-title">General</div>
      ${kv('Website', g.website)}
      ${kv('Industry', g.industry)}
      ${kv('Contact', g.contact)}
      ${kv('Role', g.role)}
      ${kv('Email', g.email)}
      ${kv('Primary language', g.language)}
      ${kv('Platform', g.platform)}
      ${kv('Google Business Profile', g.googleBusinessProfile)}
      ${kv('Google presence', g.googlePresence)}
      <div class="kv"><div class="k">Social platforms</div><div class="v">${tagList(g.socialPlatforms)}</div></div>
    </div>

    <div class="card">
      <div class="card-title">Websites</div>
      ${kv('Primary site', w.primarySite)}
      ${kv('Duplicates?', w.duplicates)}
      ${kv('Cross-links?', w.crossLinks)}
      ${kv('Authority site', w.authoritySite)}
      ${kv('Known issues', w.knownIssues)}
      ${(w.additionalSites || []).map(s => `
        <div class="sub-card">
          ${kv('URL', s.url)}
          ${kv('Purpose', s.purpose)}
          ${kv('Platform', s.platform)}
          ${kv('Status', s.status)}
          ${kv('Issues', s.issues)}
        </div>`).join('') || ''}
    </div>

    <div class="card">
      <div class="card-title">Customer</div>
      ${kv('Ideal customer', c.idealCustomer)}
      ${kv('Buyer = user?', c.buyerUserSame)}
      ${kv('Buyer/user detail', c.buyerUserDesc)}
      ${kv('Trigger', c.trigger)}
      ${(c.personas || []).map(p2 => `
        <div class="sub-card">
          ${kv('Job title', p2.title)}
          ${kv('What they care about', p2.cares)}
          ${kv('Metric', p2.metric)}
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-title">Problem</div>
      ${kv('Description', p.description)}
      ${kv('Pain type', p.painType)}
      ${kv('Pain detail', p.painDetail)}
      ${kv('Tried before', p.triedBefore)}
      ${kv('Conference description', p.conferenceDesc)}
    </div>

    <div class="card">
      <div class="card-title">Job to be done</div>
      ${kv('Outcome', j.outcome)}
      ${kv('Success @ 30 days', j.success30)}
      ${kv('Success @ 90 days', j.success90)}
      ${kv('Success @ 180 days', j.success180)}
      ${kv('Metrics', j.metrics)}
    </div>

    <div class="card">
      <div class="card-title">Category</div>
      ${kv('Category', cat.category)}
      ${kv('Other terms', cat.otherTerms)}
      ${kv('Elevator pitch', cat.elevatorPitch)}
    </div>

    <div class="card">
      <div class="card-title">Competitors</div>
      ${kv('Competitors', comp.competitors)}
      ${kv('Status quo', comp.statusQuo)}
      ${kv('Confusion', comp.confusion)}
    </div>

    <div class="card">
      <div class="card-title">Search patterns</div>
      ${kv('FAQ questions', sp.faqQuestions)}
      ${kv('Objections', sp.objections)}
      ${kv('How found', sp.howFound)}
      ${kv('Misconceptions', sp.misconceptions)}
    </div>

    <div class="card">
      <div class="card-title">Differentiators</div>
      ${kv('Why choose us', diff.whyChoose)}
      ${kv('Not a fit', diff.notFit)}
      ${kv('Strongest fit', diff.strongest)}
    </div>

    <div class="card">
      <div class="card-title">Proof</div>
      ${kv('Star clients', pf.starClients)}
      ${kv('Years in business', pf.yearsBusiness)}
      ${kv('Awards', pf.awards)}
      ${kv('Reviews', pf.reviews)}
      <div class="kv"><div class="k">Brands mentioned</div><div class="v">${tagList(pf.brands)}</div></div>
    </div>

    ${extraCard}
  `;
}

// Nothing on this page runs until the server confirms this browser holds a live session. A value in
// storage is not proof of anything — a stored flag once opened the internal pages indefinitely, with
// no code ever asked for again. If there is no live session the gate is shown, where a password and
// a code are both required.
window.akoreRequireStaff().then(function (gate) {
  if (!gate.ok) { if (!gate.redirecting) showPasswordGate(); return; }
  load();
});
</script>
</body>
</html>
